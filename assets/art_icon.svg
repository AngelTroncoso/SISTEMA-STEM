<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:1" />
    </linearGradient>
    <filter id="artGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#artGlow)">
    <!-- Paleta de pintura -->
    <ellipse cx="30" cy="35" rx="20" ry="15" fill="none" stroke="url(#artGrad)" stroke-width="3"/>
    <!-- Pincel -->
    <line x1="45" y1="15" x2="35" y2="25" stroke="url(#artGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M45 15 L48 12 L52 16 L49 19 Z" fill="#FFA726"/>
    <!-- Colores en la paleta -->
    <circle cx="25" cy="32" r="3" fill="#FFA726" opacity="0.8"/>
    <circle cx="35" cy="32" r="3" fill="#FF6F00" opacity="0.8"/>
    <circle cx="30" cy="38" r="3" fill="#FFB74D" opacity="0.8"/>
  </g>
</svg>
